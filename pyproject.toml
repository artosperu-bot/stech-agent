[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stech-agent"
version = "0.1.0"
description = "S-TECH product catalog agent core"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "playwright>=1.55,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
